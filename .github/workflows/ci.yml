name: SEM Landings CI

on:
  push:
    branches: [main, 'refactor/**', 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sem-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      clients: ${{ steps.clients.outputs.clients }}
    steps:
      - uses: actions/checkout@v4
      - id: clients
        name: Discover client applications
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          clients = sorted(p.parent.name for p in Path('clients').glob('*/client.json'))
          assert clients, 'No client applications found'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('clients=' + json.dumps(clients) + '\n')
          PY
      - name: Check committed files and secrets
        run: python scripts/check_hygiene.py

  unit:
    name: ${{ matrix.client }} · PHP ${{ matrix.php }} · lint/unit/tracking
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: ${{ fromJSON(needs.discover.outputs.clients) }}
        php: ['8.2', '8.4']
    defaults:
      run:
        working-directory: clients/${{ matrix.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, openssl, iconv
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP and JavaScript syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find . -name '*.php' -print0)
          for file in assets/js/*.js tests/*.cjs; do node --check "$file"; done
      - run: php tests/unit.php
      - run: node --test tests/tracking.cjs

  integration:
    name: ${{ matrix.client }} · MariaDB/SMTP/HTTP/Chromium
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: ${{ fromJSON(needs.discover.outputs.clients) }}
    defaults:
      run:
        working-directory: clients/${{ matrix.client }}
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root-test-only
          MARIADB_DATABASE: sem_ci
          MARIADB_USER: sem_ci
          MARIADB_PASSWORD: database-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      INNOVAPRO_CONFIG: /tmp/innovapro-config.php
      TEST_SMTP_DIR: /tmp/innovapro-smtp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, openssl, iconv
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Configure private fixtures and authenticated SMTP
        run: |
          mkdir -p "$TEST_SMTP_DIR"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$TEST_SMTP_DIR/key.pem" -out "$TEST_SMTP_DIR/cert.pem" \
            -days 2 -subj /CN=localhost \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          php tests/configure.php "$INNOVAPRO_CONFIG"
          python tests/smtp_server.py --dir "$TEST_SMTP_DIR" >/tmp/innovapro-smtp.log 2>&1 &
          for i in {1..20}; do
            if python -c "import socket;socket.create_connection(('127.0.0.1',1025),1).close()"; then break; fi
            sleep 1
          done
      - name: Schema, idempotency and real SMTP
        run: php -d openssl.cafile="$TEST_SMTP_DIR/cert.pem" tests/integration.php
      - name: Start HTTP server
        run: |
          PHP_CLI_SERVER_WORKERS=4 php -d openssl.cafile="$TEST_SMTP_DIR/cert.pem" \
            -S 127.0.0.1:8765 tests/router.php >/tmp/innovapro-php.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/innovapro-php.log
          exit 1
      - name: HTTP contracts and server-protected admin
        run: python tests/http_contract.py --base http://127.0.0.1:8765 --smtp-dir "$TEST_SMTP_DIR"
      - name: Browser responsive, consent and tracking contracts
        run: python tests/browser.py --base http://127.0.0.1:8765 --out /tmp/innovapro-browser
      - name: Browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.client }}-simple-browser-qa
          path: /tmp/innovapro-browser
          retention-days: 14
      - name: Safe fixture logs on failure
        if: failure()
        run: |
          cat /tmp/innovapro-php.log || true
          cat /tmp/innovapro-smtp.log || true
