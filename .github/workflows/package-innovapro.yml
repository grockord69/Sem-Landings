name: Package InnovaPro simple upload

on:
  workflow_dispatch:
  push:
    branches: [main, 'refactor/innovapro-simple']
    paths:
      - 'clients/innovapro/**'
      - '.github/workflows/package-innovapro.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ready-to-upload directory
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/innovapro-upload"
          mkdir -p "$OUT"
          rsync -a clients/innovapro/ "$OUT/" \
            --exclude tests \
            --exclude docs \
            --exclude README.md \
            --exclude client.json \
            --exclude 'includes/config.php'
          cp "$OUT/includes/config.example.php" "$OUT/includes/config.php"
          rm -f "$OUT/includes/config.example.php"
      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: innovapro-simple-upload
          path: ${{ runner.temp }}/innovapro-upload
          if-no-files-found: error
          retention-days: 14
