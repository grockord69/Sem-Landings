name: Apply InnovaPro simple refactor

on:
  push:
    branches: ['refactor/innovapro-simple']
    paths:
      - '.payload/**'
      - '.github/workflows/apply-simple-refactor.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/innovapro-simple
      - name: Apply payload
        run: |
          set -euo pipefail
          mkdir -p /tmp/innovapro-images
          cp -a clients/innovapro/public/assets/img/. /tmp/innovapro-images/
          cat .payload/chunk-* | base64 -d > /tmp/innovapro-simple.tar.gz
          rm -rf clients/innovapro
          tar -xzf /tmp/innovapro-simple.tar.gz -C .
          mkdir -p clients/innovapro/assets/img
          cp -a /tmp/innovapro-images/. clients/innovapro/assets/img/
          rm -rf .payload
          # El token de Actions no puede modificar workflows. Los actualizamos
          # después con la integración de GitHub y preservamos aquí los actuales.
          git restore --source=HEAD -- .github/workflows
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(innovapro): simplify deployment architecture"
          git push origin HEAD:refactor/innovapro-simple
