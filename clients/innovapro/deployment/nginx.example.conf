# Plantilla, NO importar sin ajustar rutas/socket/TLS. No modifica ningún servidor.
# En bloque http: logs sin query ni Referer. Retención y acceso a IP bajo política propia.
# log_format innova_min '$remote_addr $time_local "$request_method $uri" $status';
server {
    listen 443 ssl;
    server_name demo.innovapro.es;
    root /srv/sem-landings/clients/innovapro/public;
    index index.php;
    autoindex off;
    client_max_body_size 32k;
    # ssl_certificate /RUTA/fullchain.pem;
    # ssl_certificate_key /RUTA/privkey.pem;
    # access_log /RUTA/innova-access.log innova_min;

    location ~ /\. { deny all; }
    location ~ ^/(src|config|vendor|var|sql|bin|docs|tests|templates|deployment)(/|$) { deny all; }
    location ~* \.(sql|log|ini|env|bak|md|json|lock)$ { deny all; }
    location ~* \.(css|js|png|webp)$ { try_files $uri =404; expires 1d; }
    location / { try_files $uri $uri/ =404; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        # Solo cuando NO se esté usando auth de servidor. PHP hace Basic Auth de forma segura:
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 30s;
        fastcgi_cache off;
    }
}
server {
    listen 80;
    server_name demo.innovapro.es;
    return 301 https://demo.innovapro.es$request_uri;
}
